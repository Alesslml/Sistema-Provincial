<style>
  html, body { background: #F4FBF3; color: #0C2B0B; font-family: 'DM Sans', system-ui, sans-serif; }
  body { margin: 0; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }
  .serif { font-family: 'Playfair Display', Georgia, serif; }
  .smallcaps { letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; font-weight: 600; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CEEACB; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #AACFA7; }

  /* ticker */
  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-track { animation: ticker 90s linear infinite; }

  /* shimmer for loading */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .shimmer { background: linear-gradient(90deg, #CEEACB 0%, #E8F5E6 50%, #CEEACB 100%); background-size: 800px 100%; animation: shimmer 1.4s linear infinite; }

  /* dotted-bg placeholders */
  .placeholder-stripes {
    background-image: repeating-linear-gradient(135deg, rgba(39,174,34,0.07) 0, rgba(39,174,34,0.07) 1px, transparent 1px, transparent 8px);
    border: 1px dashed rgba(39,174,34,0.22);
  }

  /* fade-in */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
  .fade-up { animation: fadeUp 0.45s cubic-bezier(.2,.7,.3,1) both; }
  .fade-up.d1 { animation-delay: .06s }
  .fade-up.d2 { animation-delay: .14s }
  .fade-up.d3 { animation-delay: .22s }
  .fade-up.d4 { animation-delay: .3s }

  /* drawer slide */
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .slide-in { animation: slideIn .35s cubic-bezier(.2,.7,.3,1) both; }

  /* peru map hover */
  .peru-dep { transition: filter .15s ease, stroke-width .15s ease; cursor: pointer; }
  .peru-dep:hover { filter: brightness(0.92); stroke-width: 1.4; }
  .peru-dep.active { stroke: #0C2B0B; stroke-width: 2; }

  /* checkbox */
  .chk { width:16px;height:16px;border:1.5px solid #27AE22;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer; flex-shrink: 0; background:#fff;}
  .chk.on { background:#27AE22; border-color:#27AE22; }
  .chk.on::after { content:""; width:8px;height:5px; border-left:1.5px solid #F4FBF3; border-bottom:1.5px solid #F4FBF3; transform: rotate(-45deg) translate(1px,-1px); }

  /* Leaflet map styles */
  .leaflet-container { background: #E8F5E6; }
  .leaflet-tile { filter: brightness(0.97) saturate(0.9); }
  .leaflet-control { font-family: 'DM Sans', system-ui, sans-serif; }
  .leaflet-control-attribution { display: none; }

</style>

<body>
<div id="root"></div>
<div id="err-overlay" style="display:none;position:fixed;inset:0;background:#1a0e08;color:#f8dcbe;font-family:monospace;padding:32px;font-size:13px;z-index:9999;overflow:auto;white-space:pre-wrap"></div>
<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('err-overlay');
  el.style.display = 'block';
  var stack = (e.error && e.error.stack) ? e.error.stack.split('\n').slice(0,6).join('\n') : '(no stack)';
  el.textContent += '❌ ' + e.message + '\n' + stack + '\n\n---\n\n';
});
</script>
